name: Build Ekoquick Customer APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore (if configured)
        id: keystore
        working-directory: android-app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && break || { echo "Attempt $i failed, retrying..."; sleep 10; }; done

      - name: Build debug APK (no signing secrets configured yet)
        if: steps.keystore.outputs.has_keystore != 'true'
        working-directory: android-app/android
        run: for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && break || { echo "Attempt $i failed, retrying..."; sleep 10; }; done

      - name: Upload release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ekoquick-customer-release-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: steps.keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ekoquick-customer-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit latest APK into the repo for easy download
        working-directory: android-app
        run: |
          mkdir -p builds
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk builds/ekoquick-customer-latest.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk builds/ekoquick-customer-latest.apk
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/builds/ekoquick-customer-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update built APK [skip ci]"
            git push
          else
            echo "APK unchanged, nothing to commit"
          fi
