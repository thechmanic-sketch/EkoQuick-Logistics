<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekoquick</title>
    <style>
        html, body { background: #0B0F16; height: 100%; margin: 0; }
        .splash { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
        .splash .logo { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 700; color: #F1EEE6; letter-spacing: 0.02em; }
        .splash .logo span { color: #FF6A2B; }
        .splash .dot { width: 8px; height: 8px; border-radius: 50%; background: #FF6A2B; animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo">Eko<span>quick</span></div>
        <div class="dot"></div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="config.js"></script>
    <script>
        // This app's entry point never shows the public marketing homepage —
        // that's a website page, not an app screen. Route straight to the
        // signed-in dashboard or the login screen based on session state.
        (async function () {
            try {
                var { data: { session } } = await supabase.auth.getSession();
                window.location.replace(session ? 'dashboard.html' : 'login.html');
            } catch (err) {
                window.location.replace('login.html');
            }
        })();
    </script>
</body>
</html>
